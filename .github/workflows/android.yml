name: Android

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android platform
        run: bash tool/bootstrap_android.sh

      - name: Resolve packages
        run: flutter pub get

      - name: Patch plugins for new AGP
        run: |
          for f in "$HOME"/.pub-cache/hosted/pub.dev/*/android/build.gradle; do
            [ -f "$f" ] || continue
            sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' "$f" || true
            sed -E -i 's/(compileSdk(Version)?[ =]+)3[0-9]/\136/g' "$f" || true
          done

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Apply dart fix
        run: dart fix --apply

      - name: Format
        run: dart format .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ecosystemku-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
