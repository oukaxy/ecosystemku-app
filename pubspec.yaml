name: ecosystemku
description: EcosystemKu Android super app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.27
  flutter_inappwebview: ^6.1.5
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  archive: ^3.6.1
  file_picker: ^8.1.6
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  fl_chart: ^0.69.2
  cryptography: ^2.7.0
  intl: ^0.19.0
  html: ^0.15.4
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/live2d/web/
    - assets/live2d/vendor/
    - assets/live2d/rem/
    - assets/live2d/rem/motions/
    - assets/live2d/rem/textures/
    - assets/live2d/rem/audio/
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
          weight: 400
        - asset: assets/fonts/DMSans-500.ttf
          weight: 500
        - asset: assets/fonts/DMSans-600.ttf
          weight: 600
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-400.ttf
          weight: 400
        - asset: assets/fonts/Lora-500.ttf
          weight: 500
